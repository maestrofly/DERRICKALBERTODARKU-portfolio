
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DevLifeFly Contact Form</title>
  </head>
  <body>
    <form
      name="devlifefly-contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="devlifefly-contact" />
      <input name="bot-field" />
      <input name="name" />
      <input type="email" name="email" />
      <input name="business" />
      <input name="service" />
      <input name="budget" />
      <textarea name="description"></textarea>
      <input name="consent" />
    </form>
  </body>
</html>
